name: Feature idea
description: Something you'd like SummerStation64 to do.
labels:
  - "enhancement"
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome! The [roadmap in the README](https://github.com/Kerillian0/SummerStation64#-roadmap) shows what is already planned.
        Everything has to run on a stock console without the Expansion Pak, so some ideas may come as an option for 8MB only.

  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like the menu to do?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: What would it make easier or nicer? How do you use the menu today?
    validations:
      required: false

  - type: dropdown
    id: where
    attributes:
      label: Where in the menu
      options:
        - Games, Recent or Favorites (the cover rows)
        - Folders
        - Game info
        - Settings
        - Themes and the Theme Maker
        - Start-up and intro
        - Card Prep (the PC page)
        - Somewhere new
    validations:
      required: false

  - type: textarea
    id: pictures
    attributes:
      label: Pictures or examples
      description: Mockups, photos, or another menu or console that does it well.
    validations:
      required: false
