name: Bug report
description: Something in SummerStation64 doesn't work as it should.
labels:
  - "bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! Every build is tested on one console, so reports from other setups help a lot.
        A photo of the screen is worth a thousand words; the debug log (see the end of this form) is worth even more.

  - type: input
    id: menu_version
    attributes:
      label: Menu version
      description: In the menu, press START, then "Menu information"; or the name of the release you downloaded.
      placeholder: SummerStation64 v0.1
    validations:
      required: true

  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Art Edition (sc64menu.n64, covers built in)
        - Standard (the .zip, covers from the SD card)
        - I built it myself
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: memory
    attributes:
      label: Expansion Pak
      options:
        - Expansion Pak (8MB)
        - Jumper Pak (4MB)
        - Analogue 3D
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: region
    attributes:
      label: Console region
      options:
        - NTSC (USA, Japan)
        - PAL (Europe, Australia)
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: display
    attributes:
      label: Picture
      description: How the console is connected to the screen.
      options:
        - CRT, composite
        - CRT, S-Video
        - CRT, RGB
        - HDMI mod or adapter
        - Upscaler (RetroTINK, OSSC, ...)
        - Analogue 3D
        - Other
    validations:
      required: false

  - type: input
    id: firmware
    attributes:
      label: SummerCart64 firmware
      description: In the menu, press START, then "Flashcart information".
      placeholder: v2.20.2
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps, if you can repeat it.
      placeholder: |
        1. Open the Games tab
        2. Press Z on ...
        3.
    validations:
      required: false

  - type: textarea
    id: photos
    attributes:
      label: Photos or screenshots
      description: Drag pictures in here. A photo of the TV is fine; START on a controller in port 2 also saves a screenshot to menu/screenshots on the SD card.
    validations:
      required: false

  - type: textarea
    id: settings
    attributes:
      label: Theme and settings
      description: The theme in use (built-in name or share code), and anything you changed in Settings that may matter. The files menu/options.ini and menu/features.ini on the SD card hold your settings, if you'd like to paste them.
    validations:
      required: false

  - type: textarea
    id: log
    attributes:
      label: Debug log
      description: |
        Optional, but the most useful thing you can send. With the SummerCart64 connected to a PC by USB, run
        `sc64deployer debug --no-writeback` (from the SummerCart64 tools), do what goes wrong, and paste the text here.
      render: text
    validations:
      required: false
